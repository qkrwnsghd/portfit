name: ETF 구성종목 자동 갱신

on:
  schedule:
    - cron: "10 9 * * *"     # 매일 09:10 UTC = 한국 시간 18:10 (주말엔 데이터 변화 없음, 서버 깨우기용)
  workflow_dispatch:          # Actions 탭에서 'Run workflow' 버튼으로 바로 실행

permissions:
  contents: write             # holdings.json을 저장소에 커밋하기 위해 필요

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 로그인 서버(Supabase) 깨우기
        continue-on-error: true   # 무료 서버는 오래 안 쓰면 멈춰서, 매일 한 번 가볍게 조회해 깨워 둠
        run: |
          curl -s -o /dev/null -w "Supabase 응답 %{http_code}\n" \
            "https://qrtzhjleopsimxcekbgo.supabase.co/rest/v1/events?select=id&limit=1" \
            -H "apikey: sb_publishable_LwX5Sxi2L32sFcFPHZ4nUg_RNnqtENW"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: pip install pykrx

      - name: 거래소에서 구성종목 받기
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python collect.py

      - name: 국내 종목 종가 받기 (평가손익용)
        continue-on-error: true   # 실패해도 구성종목 저장은 계속
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python prices.py

      - name: 미국 ETF 전체 구성종목 계산 (주식 수 × 미국 주가)
        continue-on-error: true   # 실패하면 이전 데이터를 그대로 씀
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          pip install yfinance lxml
          python us_holdings.py

      - name: 바뀐 데이터가 있으면 저장
        run: |
          git config user.name "portfit-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add holdings.json
          [ -f prices.json ] && git add prices.json
          [ -f us_symbols.json ] && git add us_symbols.json
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어요."
          else
            git commit -m "ETF 구성종목 자동 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git push
          fi
