name: ETF 구성종목 자동 갱신

on:
  schedule:
    - cron: "10 9 * * *"     # 매일 09:10 UTC = 한국 시간 18:10 (주말엔 데이터 변화 없음, 서버 깨우기용)
  workflow_dispatch:          # Actions 탭에서 'Run workflow' 버튼으로 바로 실행

permissions:
  contents: write             # holdings.json을 저장소에 커밋하기 위해 필요

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 로그인 서버(Supabase) 깨우기
        continue-on-error: true   # 무료 서버는 오래 안 쓰면 멈춰서, 매일 한 번 가볍게 조회해 깨워 둠
        run: |
          curl -s -o /dev/null -w "Supabase 응답 %{http_code}\n" \
            "https://qrtzhjleopsimxcekbgo.supabase.co/rest/v1/events?select=id&limit=1" \
            -H "apikey: sb_publishable_LwX5Sxi2L32sFcFPHZ4nUg_RNnqtENW"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: pip install pykrx

      - name: 거래소에서 구성종목 받기
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python collect.py

      - name: 국내 종목 종가 받기 (평가손익용)
        continue-on-error: true   # 실패해도 구성종목 저장은 계속
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python prices.py

      - name: 미국 ETF 전체 구성종목 계산 (주식 수 × 미국 주가)
        continue-on-error: true   # 실패하면 이전 데이터를 그대로 씀
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          pip install yfinance lxml
          python us_holdings.py

      - name: 레버리지 ETF 시세 기록 (레버리지 탭용)
        continue-on-error: true   # 실패하면 이전 기록을 그대로 씀
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          pip install yfinance
          python lev_hist.py

      - name: ETF별 공유·검색 페이지 만들기
        continue-on-error: true
        run: python make_pages.py

      - name: 바뀐 데이터가 있으면 저장
        run: |
          git config user.name "portfit-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add holdings.json
          [ -f prices.json ] && git add prices.json
          [ -f us_symbols.json ] && git add us_symbols.json
          [ -f lev_hist.json ] && git add lev_hist.json
          [ -f lev_old.json ] && git add lev_old.json
          [ -d etf ] && git add etf sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어요."
          else
            git commit -m "ETF 구성종목 자동 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            # GitHub 서버가 잠깐 오류를 내도(예: 11/4 Internal Server Error) 최대 3번 다시 올려 봄
            for i in 1 2 3; do
              if git push; then echo "저장 완료 (${i}번째 시도)"; exit 0; fi
              echo "저장 실패 — $((i * 30))초 뒤 다시 시도해요."
              sleep $((i * 30))
              git pull --rebase origin main || { git rebase --abort; exit 1; }   # 그 사이 다른 커밋이 올라왔으면 위에 얹기
            done
            echo "3번 모두 실패했어요."; exit 1
          fi
